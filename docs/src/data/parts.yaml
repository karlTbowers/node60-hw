- id: GYF1H470MCQ1GS
  mpn: GYF1H470MCQ1GS
  manufacturer: Nichicon
  qty: 1
  label: GYF1H470MCQ1GS (47 µF 50 V hybrid polymer)
  function: "VBAT_FILT damping capacitor C207 for the L201 EMI filter (U302's input); C217 beside it is the same part, not fitted (DNP), for bench tuning"
  subsystem: power
  status: selected
  decision_note: "Selected 2026-11-03 (user, decision page). Hybrid polymer aluminium, 47 µF ±20 %, 50 V, ESR 40 mΩ, 4000 h at 125 °C, AEC-Q200, 6.3 × 7.7 mm can (8.0 mm max), so it goes on the top side under the 9.0 mm low lid: no 47 µF / ≥ 50 V / 125 °C electrolytic fits under the board (6.17 mm). Damping per TI AN-2162: Cd ≥ 4 × CIN (about 12 µF effective), filter peak 0.66 Ω with 2.2 µH against U302's 3.1 Ω worst input impedance (3 A out, 6 V in). 50 V = 1.47 × the 34 V OV cut-off (AN-2162 asks ≥ 1.25 ×). C217 (DNP, same footprint CP_Elec_6.3x7.7) takes a second 47 µF or, with C207, 2 × 22 µF. Rejected: UCZ1H470MCS6GS (plain aluminium; ESR 0.5 Ω rises to 5 Ω at −40 °C, filter peak 2.5 Ω), T598X156M063ATE075 × 3 (fits the bottom side, 4.3 mm, but about $17), every 35 V polymer tantalum and T598D106M050 (below 34 V at 125 °C), a ceramic bank (no ESR to damp; would need a series resistor)"
  second_source: HHXC500ARA220MF61G
  observations:
    - { date: 2026-11-03, source: DigiKey GYF1H470MCQ1GCT-ND, prices: [{ qty: "1", usd: 1.40 }], stock: 10450 }
